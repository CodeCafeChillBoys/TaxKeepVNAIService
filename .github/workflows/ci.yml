name: AI Service CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    name: Run Lint & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TaxAIService

    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/taxkeep_ai_test"
      GEMINI_API_KEY: "dummy-gemini-key-for-ci-testing"
      OPENAI_API_KEY: "dummy-openai-key-for-ci-testing"
      RABBITMQ_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: TaxAIService/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
          pip install pytest-cov

      - name: Lint with Ruff
        run: |
          # Bắt các lỗi cú pháp (SyntaxError) và import không xác định
          ruff check . --select E9,F63,F7,F82

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-fail-under=65

      # Bước gửi email thông báo kết quả (Luôn là bước cuối cùng)
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: vovancuong1208@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[CI Report] Kết quả test nhánh ${{ github.ref_name }} - Trạng thái: ${{ job.status }}"
          to: vovancuong1208@gmail.com
          from: "GitHub Actions CI <vovancuong1208@gmail.com>"
          body: |
            Xin chào,
            
            Pipeline CI của dự án TaxKeepVNAIService vừa hoàn tất kiểm thử:
            - Trạng thái: ${{ job.status == 'success' && 'THÀNH CÔNG 🟢' || 'THẤT BẠI 🔴' }}
            - Nhánh: ${{ github.ref_name }}
            - Người thực hiện: ${{ github.actor }}
            - Commit: ${{ github.sha }}
            - Chi tiết log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
name: AI Service CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    name: Run Lint & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TaxAIService

    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/taxkeep_ai_test"
      GEMINI_API_KEY: "dummy-gemini-key-for-ci-testing"
      OPENAI_API_KEY: "dummy-openai-key-for-ci-testing"
      RABBITMQ_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: TaxAIService/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          # Bắt các lỗi cú pháp (SyntaxError) và import không xác định
          ruff check . --select E9,F63,F7,F82

      - name: Run Pytest
        run: |
          pytest -v

name: Deploy AI Service to AWS EC2

on:
  push:
    branches: [ "develop", "Develop" ]
  workflow_dispatch: # Cho phép trigger deploy thủ công trên giao diện GitHub

jobs:
  test:
    name: 1. CI - Lint & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TaxAIService

    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/taxkeep_ai_test"
      GEMINI_API_KEY: "dummy-gemini-key-for-ci-testing"
      OPENAI_API_KEY: "dummy-openai-key-for-ci-testing"
      RABBITMQ_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: TaxAIService/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
          pip install pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check . --select E9,F63,F7,F82

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-fail-under=65

  deploy:
    name: 2. CD - Build Docker Image & Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          cd TaxAIService
          docker build -t taxkeep-ai:latest -f Dockerfile .
          docker save taxkeep-ai:latest | gzip > ../ai.tar.gz

      - name: Copy Docker Image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "ai.tar.gz"
          target: "~/taxkeep/"

      - name: Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/taxkeep
            docker load < ai.tar.gz
            rm -f ai.tar.gz
            docker compose up -d ai_service
            docker image prune -f
